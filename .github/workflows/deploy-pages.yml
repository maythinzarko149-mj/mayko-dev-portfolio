name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Read GitHub Pages address
        id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Export all portfolio pages and certificates
        run: bun run build:pages
        env:
          GITHUB_PAGES: "true"
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Verify the static export
        run: bun run verify:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4